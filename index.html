<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeHocCong Music</title>
  <meta name="theme-color" content="#0d0e15">
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeHocCong">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(22, 24, 35, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .disc-spin {
      animation: spin 18s linear infinite;
    }
    .disc-paused {
      animation-play-state: paused;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Custom Seekbar with YouTube Buffer bar */
    .range-slider-container {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
      cursor: pointer;
    }
    .buffered-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      border-radius: 9999px;
      width: 0%;
    }
    input[type=range] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-3 sm:p-6 md:p-8 max-w-6xl mx-auto">

  <!-- Header -->
  <header class="flex items-center justify-between py-3 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-violet-500/20">
        <i class="fa-solid font-bold fa-compact-disc text-white text-xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none tracking-tight">BeHocCong Music</h1>
        <span class="text-xs text-emerald-400 flex items-center gap-1 mt-1 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Offline Ready
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 my-auto">
    
    <!-- Player Section -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center glass-card rounded-3xl p-6 sm:p-8 relative overflow-hidden shadow-2xl">
      
      <!-- Ambient Glow -->
      <div class="absolute -top-24 -left-24 w-60 h-60 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -right-24 w-60 h-60 bg-fuchsia-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Status Badge -->
      <div class="mb-6">
        <span id="playing-status" class="px-3 py-1 rounded-full text-xs font-semibold bg-white/5 border border-white/10 text-gray-300">
          Đang dừng
        </span>
      </div>

      <!-- Vinyl Disc Visualizer -->
      <div class="relative my-4 flex items-center justify-center">
        <div id="vinyl-disc" class="w-56 h-56 sm:w-64 sm:h-64 rounded-full bg-neutral-900 border-4 border-neutral-800 shadow-2xl flex items-center justify-center disc-spin disc-paused relative">
          <!-- Groove Lines -->
          <div class="absolute inset-2 rounded-full border border-neutral-800/60"></div>
          <div class="absolute inset-6 rounded-full border border-neutral-800/80"></div>
          <div class="absolute inset-10 rounded-full border border-neutral-800/60"></div>
          <div class="absolute inset-14 rounded-full border border-neutral-800/40"></div>
          
          <!-- Center Vinyl Label -->
          <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-inner text-white">
            <i class="fa-solid fa-music text-2xl"></i>
          </div>
          <!-- Center Hole -->
          <div class="absolute w-4 h-4 bg-black rounded-full border-2 border-neutral-700"></div>
        </div>
      </div>

      <!-- Song Title & Artist -->
      <div class="text-center mt-6 mb-4 w-full px-4">
        <h2 id="song-title" class="text-xl sm:text-2xl font-bold text-white tracking-wide truncate">--</h2>
        <p id="song-artist" class="text-sm text-gray-400 mt-1 truncate">--</p>
      </div>

      <!-- Progress Bar (With YouTube-like Buffer Indicator) -->
      <div class="w-full mt-2">
        <div class="range-slider-container" id="seekbar-container">
          <div class="buffered-bar" id="buffered-bar"></div>
          <div class="progress-bar" id="progress-bar"></div>
          <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="flex justify-between text-xs text-gray-400 mt-2 font-mono">
          <span id="current-time">00:00:00</span>
          <span id="total-duration">00:00:00</span>
        </div>
      </div>

      <!-- Player Controls -->
      <div class="flex items-center justify-center gap-4 sm:gap-6 mt-6 w-full">
        <!-- Shuffle -->
        <button id="btn-shuffle" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-shuffle text-sm"></i>
        </button>

        <!-- Previous -->
        <button id="btn-prev" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white transition active:scale-95">
          <i class="fa-solid fa-backward-step text-base"></i>
        </button>

        <!-- Play Button -->
        <button id="btn-play" class="w-14 h-14 rounded-full bg-gradient-to-tr from-violet-600 to-fuchsia-600 hover:scale-105 flex items-center justify-center text-white shadow-lg shadow-violet-500/30 transition active:scale-95">
          <i class="fa-solid fa-play text-xl ml-0.5"></i>
        </button>

        <!-- Pause Button -->
        <button id="btn-pause" class="w-14 h-14 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition active:scale-95">
          <i class="fa-solid fa-pause text-xl"></i>
        </button>

        <!-- Next -->
        <button id="btn-next" class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white transition active:scale-95">
          <i class="fa-solid fa-forward-step text-base"></i>
        </button>

        <!-- Repeat -->
        <button id="btn-repeat" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-400 hover:text-white transition">
          <i class="fa-solid fa-repeat text-sm"></i>
        </button>
      </div>

    </section>

    <!-- Playlist Section -->
    <section class="lg:col-span-5 glass-card rounded-3xl p-6 flex flex-col h-full shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-lg text-white">Danh Sách Phát</h3>
        <span class="text-xs bg-white/10 text-gray-300 px-2.5 py-1 rounded-full font-medium">3 bài</span>
      </div>

      <!-- Song List -->
      <div id="playlist" class="flex flex-col gap-2 overflow-y-auto max-h-[400px] lg:max-h-full pr-1">
        <!-- Dynamic JS Render -->
      </div>
    </section>

  </main>

  <audio id="audio-player" preload="metadata"></audio>

  <script>
    const SONGS = [
      {
        id: 0,
        title: "999 Đóa Hồng",
        artist: "Lâm Trí Hải - Long Nhật",
        src: "music/999DoaHong-LamTriHaiLongNhat-2450373.mp3"
      },
      {
        id: 1,
        title: "Bước Chân Lẻ Loi",
        artist: "Đan Trường",
        src: "music/BuocChanLeLoi-DanTruong_3tvaj.mp3"
      },
      {
        id: 2,
        title: "Còn Lại Một Mình",
        artist: "Đan Trường",
        src: "music/ConLaiMotMinh-DanTruong_3kavx.mp3"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    // DOM Elements
    const audio = document.getElementById('audio-player');
    const songTitle = document.getElementById('song-title');
    const songArtist = document.getElementById('song-artist');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const seekSlider = document.getElementById('seek-slider');
    const progressBar = document.getElementById('progress-bar');
    const bufferedBar = document.getElementById('buffered-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const vinylDisc = document.getElementById('vinyl-disc');
    const playingStatus = document.getElementById('playing-status');
    const playlistEl = document.getElementById('playlist');

    // Register Service Worker for auto-caching offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'music-app-v2';
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', e => {
            if (e.request.url.endsWith('.mp3')) {
              e.respondWith(
                caches.match(e.request).then(cached => {
                  if (cached) return cached;
                  return fetch(e.request).then(response => {
                    if (response.status === 200) {
                      const clone = response.clone();
                      caches.open(CACHE_NAME).then(cache => cache.put(e.request, clone));
                    }
                    return response;
                  });
                })
              );
            } else {
              e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
            }
          });
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderPlaylist() {
      playlistEl.innerHTML = SONGS.map((song, idx) => `
        <div onclick="selectSong(${idx})" class="flex items-center justify-between p-3 rounded-2xl cursor-pointer transition ${idx === currentIndex ? 'bg-violet-600/20 border border-violet-500/30' : 'hover:bg-white/5 border border-transparent'}">
          <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0">
              <i class="fa-solid fa-compact-disc ${idx === currentIndex && isPlaying ? 'text-violet-400 animate-spin' : 'text-gray-400'}"></i>
            </div>
            <div class="truncate">
              <h4 class="font-semibold text-sm truncate ${idx === currentIndex ? 'text-violet-300' : 'text-white'}">${song.title}</h4>
              <p class="text-xs text-gray-400 truncate">${song.artist}</p>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full flex items-center justify-center ${idx === currentIndex ? 'text-violet-400' : 'text-gray-500'}">
            <i class="fa-solid ${idx === currentIndex && isPlaying ? 'fa-volume-high' : 'fa-play'} text-xs"></i>
          </div>
        </div>
      `).join('');
    }

    function loadSong(song) {
      songTitle.textContent = song.title;
      songArtist.textContent = song.artist;
      audio.src = song.src;
      renderPlaylist();
      
      // Reset progress & buffer
      progressBar.style.width = '0%';
      bufferedBar.style.width = '0%';
      seekSlider.value = 0;
      currentTimeEl.textContent = "00:00:00";
    }

    function playSong() {
      isPlaying = true;
      audio.play().then(() => {
        vinylDisc.classList.remove('disc-paused');
        playingStatus.textContent = 'Đang phát';
        playingStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 border border-emerald-500/30 text-emerald-300';
        renderPlaylist();
      }).catch(err => {
        console.log('Playback error:', err);
      });
    }

    function pauseSong() {
      isPlaying = false;
      audio.pause();
      vinylDisc.classList.add('disc-paused');
      playingStatus.textContent = 'Đã tạm dừng';
      playingStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-white/5 border border-white/10 text-gray-300';
      renderPlaylist();
    }

    function selectSong(index) {
      currentIndex = index;
      loadSong(SONGS[currentIndex]);
      playSong();
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + SONGS.length) % SONGS.length;
      loadSong(SONGS[currentIndex]);
      playSong();
    }

    function nextSong() {
      if (isShuffle) {
        currentIndex = Math.floor(Math.random() * SONGS.length);
      } else {
        currentIndex = (currentIndex + 1) % SONGS.length;
      }
      loadSong(SONGS[currentIndex]);
      playSong();
    }

    // Event Listeners
    btnPlay.addEventListener('click', playSong);
    btnPause.addEventListener('click', pauseSong);
    btnPrev.addEventListener('click', prevSong);
    btnNext.addEventListener('click', nextSong);

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.classList.toggle('text-violet-400', isShuffle);
      btnShuffle.classList.toggle('text-gray-400', !isShuffle);
    });

    btnRepeat.addEventListener('click', () => {
      isRepeat = !isRepeat;
      btnRepeat.classList.toggle('text-violet-400', isRepeat);
      btnRepeat.classList.toggle('text-gray-400', !isRepeat);
    });

    // Update Progress & YouTube-like Buffer Bar
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        seekSlider.value = pct;
        progressBar.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('progress', () => {
      if (audio.duration && audio.buffered.length > 0) {
        const bufferedEnd = audio.buffered.end(audio.buffered.length - 1);
        const bufPct = (bufferedEnd / audio.duration) * 100;
        bufferedBar.style.width = `${bufPct}%`;
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        playSong();
      } else {
        nextSong();
      }
    });

    seekSlider.addEventListener('input', () => {
      if (audio.duration) {
        const seekTime = (seekSlider.value / 100) * audio.duration;
        audio.currentTime = seekTime;
        progressBar.style.width = `${seekSlider.value}%`;
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        isPlaying ? pauseSong() : playSong();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(audio.currentTime + 5, audio.duration || 0);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(audio.currentTime - 5, 0);
      }
    });

    // Initialize App
    loadSong(SONGS[currentIndex]);
  </script>
</body>
</html>
