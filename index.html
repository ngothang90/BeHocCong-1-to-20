<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bé Học Cộng</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game">

    <h1>🎮 Bé Học Cộng</h1>

<div id="menu">

<h2>Chọn bài học</h2>


<div id="level1Menu">

<h3>🌱 Level 1: Cộng trong phạm vi 10</h3>


<button onclick="startGame(1,1)">
📘 Bài 1<br>
Làm quen phép cộng
</button>


<button onclick="startGame(1,2)">
📘 Bài 2<br>
Cộng trong phạm vi 5
</button>


<button onclick="startGame(1,3)">
📘 Bài 3<br>
Cộng trong phạm vi 10
</button>


</div>



<div id="level2Menu">

<h3>🚀 Level 2: Cộng trong phạm vi 20</h3>


<button id="level2Btn" onclick="startGame(2,1)">
🔒 Level 2
</button>


</div>


</div>


    <div id="play" style="display:none">

        <h2 id="levelTitle"></h2>


<div id="picture">
</div>

<div id="question">
    1 + 1 = ?
</div>


        <div id="answers"></div>


        <div id="result"></div>


        <div>
            Điểm:
            <span id="score">0</span>
        </div>


        <div>
            Câu:
            <span id="count">0</span>/10
        </div>


    </div>


</div>
<div id="finish" style="display:none">

    <h2>🎉 Hoàn thành!</h2>

    <div id="finalStar">
        ⭐⭐⭐
    </div>

    <p>
        Điểm của bé:
        <span id="finalScore"></span>
    </p>


    <button onclick="restartGame()">
        🔄 Chơi lại
    </button>


    <button onclick="backMenu()">
        🏠 Chọn Level
    </button>


</div>

<script src="lesson.js"></script>
<script src="game.js"></script>

</body>
</html>
